<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故障教材专家标注平台 v2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#3B82F6;--primary-light:#DBEAFE;--primary-dark:#1D4ED8;
  --success:#10B981;--success-light:#D1FAE5;
  --warning:#F59E0B;--warning-light:#FEF3C7;
  --danger:#EF4444;--danger-light:#FEE2E2;
  --ai-bg:#EEF2FF;--reason-bg:#FEF3C7;--act-bg:#DBEAFE;
  --hook-bg:#F0FDF4;--gym-bg:#FDF4FF;
  --gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;
  --gray-300:#D1D5DB;--gray-400:#9CA3AF;--gray-500:#6B7280;
  --gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--gray-50);color:var(--gray-800);line-height:1.6}
.app{max-width:1400px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* Header */
.header{background:#fff;border-bottom:1px solid var(--gray-200);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:16px}
.logo{font-size:18px;font-weight:700;color:var(--primary)}
.nav-tabs{display:flex;gap:4px}
.nav-tab{padding:6px 16px;border-radius:20px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--gray-600);border:1px solid transparent;transition:all .2s}
.nav-tab:hover{background:var(--gray-100)}
.nav-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.header-right{display:flex;align-items:center;gap:12px}
.revision-badge{position:relative;cursor:pointer;padding:6px 12px;border-radius:20px;background:var(--warning-light);color:#92400E;font-size:13px;font-weight:600;border:1px solid #FDE68A}
.revision-badge .count{background:var(--danger);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;margin-left:4px}
.user-info{font-size:13px;color:var(--gray-500)}

/* Stepper */
.stepper{background:#fff;padding:16px 24px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:0;overflow-x:auto}
.step-item{display:flex;align-items:center;gap:8px;white-space:nowrap}
.step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:2px solid var(--gray-300);color:var(--gray-400);transition:all .3s}
.step-item.active .step-num{background:var(--primary);color:#fff;border-color:var(--primary)}
.step-item.done .step-num{background:var(--success);color:#fff;border-color:var(--success)}
.step-label{font-size:13px;color:var(--gray-500)}
.step-item.active .step-label{color:var(--gray-800);font-weight:600}
.step-item.done .step-label{color:var(--success)}
.step-sep{width:32px;height:2px;background:var(--gray-200);margin:0 4px;flex-shrink:0}

/* Main */
.main{flex:1;padding:24px;overflow-y:auto}

/* Panels */
.panel{display:none}
.panel.active{display:block}

/* Cards */
.card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--gray-200);padding:20px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* Product Cards */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.product-card{background:#fff;border:2px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px;text-align:center;cursor:pointer;transition:all .2s}
.product-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(59,130,246,.15)}
.product-card.selected{border-color:var(--primary);background:var(--primary-light)}
.product-icon{font-size:32px;margin-bottom:8px}
.product-name{font-size:14px;font-weight:600}
.product-count{font-size:12px;color:var(--gray-500)}

/* Fault Tags */
.fault-section{margin-top:20px}
.search-box{width:100%;padding:10px 16px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:14px;outline:none;transition:border .2s}
.search-box:focus{border-color:var(--primary)}
.fault-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fault-tag{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid var(--gray-300);transition:all .2s;display:flex;align-items:center;gap:6px}
.fault-tag:hover{border-color:var(--primary)}
.fault-tag.existing{border-color:var(--success);background:var(--success-light);color:#065F46}
.fault-tag.new-fault{border-color:var(--warning);background:var(--warning-light);color:#92400E}
.fault-tag .badge{font-size:11px;padding:1px 6px;border-radius:8px;font-weight:600}
.fault-tag.existing .badge{background:var(--success);color:#fff}
.fault-tag.new-fault .badge{background:var(--warning);color:#fff}

/* MCP Knowledge Card */
.mcp-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:12px 16px;margin:12px 0;font-size:13px}
.mcp-card .mcp-source{font-size:11px;color:var(--gray-500);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.mcp-card .mcp-content{color:var(--gray-700)}

/* AI Generation */
.gen-progress{margin:20px 0}
.gen-bar{height:8px;background:var(--gray-200);border-radius:4px;overflow:hidden}
.gen-fill{height:100%;background:linear-gradient(90deg,var(--primary),#8B5CF6);border-radius:4px;transition:width .3s;width:0}
.gen-stage{font-size:13px;color:var(--gray-500);margin-top:8px}
.gen-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.gen-stat{background:var(--gray-50);border-radius:var(--radius);padding:12px;text-align:center}
.gen-stat .num{font-size:24px;font-weight:700;color:var(--primary)}
.gen-stat .label{font-size:12px;color:var(--gray-500)}

/* ReAct Chat */
.react-layout{display:grid;grid-template-columns:1fr 320px;gap:16px;height:calc(100vh - 220px)}
.chat-area{display:flex;flex-direction:column;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden}
.chat-header{padding:12px 16px;border-bottom:1px solid var(--gray-200);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.chat-messages{flex:1;overflow-y:auto;padding:16px}
.chat-msg{margin-bottom:16px}
.chat-msg.ai{margin-right:40px}
.chat-msg.expert{margin-left:40px;text-align:right}
.msg-bubble{display:inline-block;padding:12px 16px;border-radius:var(--radius-lg);font-size:14px;text-align:left;max-width:100%}
.ai .msg-bubble{background:var(--ai-bg);border:1px solid #C7D2FE}
.expert .msg-bubble{background:var(--primary-light);border:1px solid #93C5FD}
.msg-meta{font-size:11px;color:var(--gray-400);margin-top:4px}

/* ReAct Tags */
.react-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-bottom:6px}
.react-tag.reasoning{background:var(--reason-bg);color:#92400E}
.react-tag.acting{background:var(--act-bg);color:#1E40AF}
.react-tag.hook{background:var(--hook-bg);color:#065F46}
.react-tag.gym{background:var(--gym-bg);color:#6B21A8}
.react-tag.mcp{background:#FEF3C7;color:#92400E}

/* Hook Alert */
.hook-alert{padding:10px 14px;border-radius:var(--radius);margin:8px 0;font-size:13px;display:flex;align-items:flex-start;gap:8px}
.hook-alert.pass{background:var(--hook-bg);border:1px solid #86EFAC;color:#065F46}
.hook-alert.warn{background:var(--warning-light);border:1px solid #FDE68A;color:#92400E}
.hook-alert.block{background:var(--danger-light);border:1px solid #FCA5A5;color:#991B1B}
.hook-alert .hook-icon{font-size:16px;flex-shrink:0}

/* Gym Result */
.gym-result{background:var(--gym-bg);border:1px solid #D8B4FE;border-radius:var(--radius);padding:12px;margin:8px 0;font-size:13px}
.gym-score{font-size:20px;font-weight:700;color:#7C3AED}
.gym-items{margin-top:8px}
.gym-item{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px}

/* MCP Inline Card */
.mcp-inline{background:#FFFBEB;border:1px solid #FDE68A;border-radius:var(--radius);padding:10px 14px;margin:8px 0;font-size:13px}
.mcp-inline .mcp-label{font-size:11px;font-weight:600;color:#92400E;margin-bottom:4px}

/* Chat Input */
.chat-input-area{padding:12px 16px;border-top:1px solid var(--gray-200)}
.tool-bar{display:flex;gap:6px;margin-bottom:8px}
.tool-btn{padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--gray-300);background:#fff;color:var(--gray-600);transition:all .2s}
.tool-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.input-row{display:flex;gap:8px}
.chat-input{flex:1;padding:10px 14px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:14px;outline:none;resize:none}
.chat-input:focus{border-color:var(--primary)}
.send-btn{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:14px;cursor:pointer;font-weight:600}
.send-btn:hover{background:var(--primary-dark)}
.quick-actions{display:flex;gap:6px;margin-top:8px}
.quick-btn{padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--gray-200);background:var(--gray-50);color:var(--gray-600)}

/* Side Panel - AgentGym + Hooks */
.side-panel{display:flex;flex-direction:column;gap:12px}
.side-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden}
.side-card-header{padding:10px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:6px}
.side-card-body{padding:12px 14px;font-size:13px}
.gym-status{display:flex;align-items:center;gap:8px;padding:8px 0}
.gym-dot{width:10px;height:10px;border-radius:50%}
.gym-dot.idle{background:var(--gray-300)}
.gym-dot.running{background:var(--warning);animation:pulse 1.5s infinite}
.gym-dot.pass{background:var(--success)}
.gym-dot.fail{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hook-list{list-style:none}
.hook-item{display:flex;align-items:center;gap:6px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--gray-100)}
.hook-item:last-child{border-bottom:none}
.hook-status{font-size:14px}
.version-info{font-size:12px;color:var(--gray-500);padding:8px 0}

/* Annotation Content */
.annotation-modules{margin-top:16px}
.module-tab{display:flex;gap:4px;margin-bottom:16px}
.module-tab-btn{padding:8px 16px;border-radius:var(--radius);font-size:13px;cursor:pointer;border:1px solid var(--gray-300);background:#fff;transition:all .2s}
.module-tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.root-cause-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:8px;background:#fff;transition:all .2s}
.root-cause-item:hover{border-color:var(--primary-light)}
.rc-actions{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.rc-btn{padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid var(--gray-300);background:#fff;transition:all .2s;font-weight:600}
.rc-btn.keep{color:var(--success);border-color:#86EFAC}
.rc-btn.keep.active{background:var(--success);color:#fff}
.rc-btn.delete{color:var(--danger);border-color:#FCA5A5}
.rc-btn.delete.active{background:var(--danger);color:#fff}
.rc-btn.edit{color:var(--primary);border-color:#93C5FD}
.rc-btn.edit.active{background:var(--primary);color:#fff}
.rc-num{font-size:12px;font-weight:700;color:var(--gray-400);min-width:20px}
.rc-text{font-size:14px;flex:1}
.rc-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.rc-badge.kept{background:var(--success-light);color:#065F46}
.rc-badge.deleted{background:var(--danger-light);color:#991B1B}
.rc-badge.modified{background:var(--primary-light);color:#1E40AF}
.rc-badge.new{background:var(--warning-light);color:#92400E}

/* Add Root Cause */
.add-rc{display:flex;gap:8px;margin-top:12px;padding:12px;background:var(--gray-50);border-radius:var(--radius);border:1px dashed var(--gray-300)}
.add-rc input{flex:1;padding:8px 12px;border:1px solid var(--gray-300);border-radius:6px;font-size:13px;outline:none}
.add-rc input:focus{border-color:var(--primary)}

/* Segment Annotation */
.segment{padding:14px;border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:10px;background:#fff}
.segment-text{font-size:14px;color:var(--gray-700);margin-bottom:10px}
.segment-actions{display:flex;gap:6px}
.seg-btn{padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--gray-300);background:#fff;font-weight:600;transition:all .2s}
.seg-btn.approve{color:var(--success)}
.seg-btn.approve.active{background:var(--success);color:#fff}
.seg-btn.modify{color:var(--primary)}
.seg-btn.modify.active{background:var(--primary);color:#fff}
.seg-btn.reject{color:var(--danger)}
.seg-btn.reject.active{background:var(--danger);color:#fff}
.modify-box{margin-top:8px;display:none}
.modify-box.show{display:block}
.modify-box textarea{width:100%;padding:8px;border:1px solid var(--gray-300);border-radius:6px;font-size:13px;resize:vertical;min-height:60px;outline:none}
.modify-box textarea:focus{border-color:var(--primary)}

/* Publish */
.publish-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.summary-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px}
.summary-card h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--gray-700)}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--gray-100)}
.stat-row:last-child{border-bottom:none}
.stat-val{font-weight:600}
.stat-val.green{color:var(--success)}
.stat-val.red{color:var(--danger)}
.stat-val.blue{color:var(--primary)}
.stat-val.amber{color:var(--warning)}
.btn-group{display:flex;gap:12px;margin-top:24px}
.btn{padding:10px 24px;border-radius:var(--radius);font-size:14px;cursor:pointer;border:1px solid var(--gray-300);background:#fff;font-weight:600;transition:all .2s}
.btn:hover{background:var(--gray-50)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}

/* Revision Panel (overlay) */
.revision-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none}
.revision-overlay.show{display:block}
.revision-panel{position:fixed;right:0;top:0;bottom:0;width:560px;background:#fff;z-index:201;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
.revision-panel.show{transform:translateX(0)}
.rev-header{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
.rev-header h2{font-size:16px;font-weight:700}
.rev-close{cursor:pointer;font-size:20px;color:var(--gray-400);background:none;border:none}
.rev-body{flex:1;overflow-y:auto;padding:16px 20px}
.rev-task{padding:12px;border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:10px;cursor:pointer;transition:all .2s}
.rev-task:hover{border-color:var(--primary)}
.rev-task.high{border-left:3px solid var(--danger)}
.rev-task.medium{border-left:3px solid var(--warning)}
.rev-task.low{border-left:3px solid var(--gray-400)}
.rev-type{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:4px}
.rev-type.root_cause{background:var(--danger-light);color:#991B1B}
.rev-type.path{background:var(--primary-light);color:#1E40AF}
.rev-type.association{background:var(--warning-light);color:#92400E}
.rev-source{font-size:12px;color:var(--gray-500)}
.rev-suggestion{font-size:13px;color:var(--gray-700);margin-top:4px}

/* Dialog Revision inside revision panel */
.rev-dialog{display:none;height:100%;flex-direction:column}
.rev-dialog.show{display:flex}
.rev-dialog-header{padding:12px 16px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:12px}
.rev-back{cursor:pointer;font-size:18px;background:none;border:none;color:var(--gray-500)}
.rev-dialog-body{flex:1;display:flex;overflow:hidden}
.rev-task-nav{width:200px;border-right:1px solid var(--gray-200);overflow-y:auto;padding:8px}
.rev-nav-item{padding:8px 10px;border-radius:6px;font-size:12px;cursor:pointer;margin-bottom:2px;display:flex;align-items:center;gap:6px;color:var(--gray-600)}
.rev-nav-item:hover{background:var(--gray-100)}
.rev-nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:600}
.rev-nav-item.done{color:var(--success)}
.rev-nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rev-chat-area{flex:1;display:flex;flex-direction:column}
.rev-chat-messages{flex:1;overflow-y:auto;padding:16px}
.rev-chat-input{padding:12px 16px;border-top:1px solid var(--gray-200);display:flex;gap:8px}

/* Toast */
.toast{position:fixed;top:80px;right:24px;padding:12px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;z-index:300;transform:translateX(120%);transition:transform .3s;display:flex;align-items:center;gap:8px}
.toast.show{transform:translateX(0)}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--danger);color:#fff}
.toast.warning{background:var(--warning);color:#fff}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">🔧 故障教材标注平台 v2.0</div>
      <nav class="nav-tabs">
        <a href="index.html" class="nav-tab active">教材标注</a>
        <a href="evaluate.html" class="nav-tab">教材评测</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="revision-badge" onclick="toggleRevisionPanel()">
        📋 修订任务<span class="count" id="revCount">3</span>
      </div>
      <div class="user-info">👤 张工 6001</div>
    </div>
  </header>

  <!-- Stepper -->
  <div class="stepper" id="stepper"></div>

  <!-- Main Content -->
  <div class="main" id="mainContent"></div>
</div>

<!-- Revision Panel Overlay -->
<div class="revision-overlay" id="revOverlay" onclick="toggleRevisionPanel()"></div>
<div class="revision-panel" id="revPanel">
  <div class="rev-header">
    <h2>📋 修订任务</h2>
    <button class="rev-close" onclick="toggleRevisionPanel()">✕</button>
  </div>
  <div class="rev-body" id="revBody">
    <!-- Task list or dialog -->
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============ DATA ============
const PRODUCTS = [
  { id:'excavator', name:'挖掘机', icon:'🚜', faults:14 },
  { id:'pump', name:'泵车', icon:'🏗️', faults:8 },
  { id:'crane', name:'起重机', icon:'🏗️', faults:6 },
  { id:'loader', name:'装载机', icon:'🚛', faults:5 },
  { id:'paver', name:'摊铺机', icon:'🛣️', faults:4 },
  { id:'roller', name:'压路机', icon:'⚙️', faults:3 }
];

const FAULTS = {
  excavator: [
    { id:'F001', name:'液压系统行走无力', existing:true, ver:'v2.0', mcp:{cases:23,experts:4} },
    { id:'F002', name:'发动机启动困难', existing:true, ver:'v1.3', mcp:{cases:15,experts:3} },
    { id:'F003', name:'回转系统异响', existing:true, ver:'v1.1', mcp:{cases:8,experts:2} },
    { id:'F004', name:'工作装置动作缓慢', existing:false, mcp:{cases:3,experts:1} },
    { id:'F005', name:'液压油温过高', existing:true, ver:'v1.5', mcp:{cases:18,experts:3} }
  ],
  pump: [
    { id:'F101', name:'泵送压力不足', existing:true, ver:'v1.2', mcp:{cases:12,experts:2} },
    { id:'F102', name:'臂架动作不稳定', existing:false, mcp:{cases:2,experts:1} }
  ]
};

const TEXTBOOK = {
  rootCauses: [
    { id:'RC1', text:'行走马达溢流阀故障', status:'kept' },
    { id:'RC2', text:'行走马达内部故障（排量调节机构卡滞、柱塞磨损）', status:'kept' },

    return `<div class="step-item ${cls}"><div class="step-num">${i+1 < state.step ? '✓' : i+1}</div><div class="step-label">${s}</div></div>${sep}`;
  }).join('');
}

  switch(state.step) {

// ============ ACTIONS ============
function selectProduct(id) {
  state.product = id;
  state.fault = null;
  render();
}

function selectFault(id) {
  state.fault = id;
  const faults = FAULTS[state.product] || [];
  const f = faults.find(x => x.id === id);
  state.faultStatus = f.existing ? 'existing' : 'new';
  render();
}

function filterFaults(val) {
  // Simple filter - just re-render tags
  const faults = FAULTS[state.product] || [];
  const el = document.getElementById('faultTags');
  if (!el) return;
  const filtered = val ? faults.filter(f => f.name.includes(val)) : faults;
  el.innerHTML = filtered.map(f => `<div class="fault-tag ${f.existing?'existing':'new-fault'}" onclick="selectFault('${f.id}')">
    ${f.name}<span class="badge">${f.existing?'已有 '+f.ver:'新增'}</span></div>`).join('');
}

function goStep(n) {
  state.step = n;
  render();
  if (n === 3) startGeneration();
  if (n === 5) startGymTest();
}

function startGeneration() {
  const stages = [
    { pct:20, text:'📚 MCP-KnowledgeBase: 检索技术文档...' },
    { pct:40, text:'💡 MCP-CaseDatabase: 获取真实维修案例...' },
    { pct:60, text:'👤 MCP-ExpertDatabase: 匹配专家历史标注...' },
    { pct:80, text:'🤖 AI 生成教材结构...' },
    { pct:100, text:'✅ 教材生成完成！' }
  ];
  let i = 0;
  const timer = setInterval(() => {
    if (i >= stages.length) { clearInterval(timer); document.getElementById('genResult').style.display='block'; return; }
    document.getElementById('genFill').style.width = stages[i].pct + '%';
    document.getElementById('genStage').textContent = stages[i].text;
    i++;
  }, 600);
}

function startGymTest() {
  const stages = [
    { pct:25, text:'加载教材知识...' },
    { pct:50, text:'生成测试场景...' },
    { pct:75, text:'执行仿真诊断...' },
    { pct:100, text:'生成仿真报告...' }
  ];
  let i = 0;
  const timer = setInterval(() => {
    if (i >= stages.length) { clearInterval(timer); document.getElementById('gymResult').style.display='block'; return; }
    const fill = document.getElementById('gymFill');
    const stage = document.getElementById('gymStage');
    if (fill) fill.style.width = stages[i].pct + '%';
    if (stage) stage.textContent = stages[i].text;
    i++;
  }, 800);
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  state.chatHistory.push({ role:'expert', text });
  // Simulate AI ReAct response
  setTimeout(() => {
    const response = generateReactResponse(text);
    state.chatHistory.push(response);
    if (response.hookTrigger) {
      state.hookResults = { ...state.hookResults, ...response.hookTrigger };
    }
    if (response.gymUpdate) {
      state.gymStatus = response.gymUpdate.status;
      state.gymScore = response.gymUpdate.score;
    }
    render();
    scrollChat();
  }, 500);
  render();
  scrollChat();
}

function quickChat(text) {
  document.getElementById('chatInput').value = text;
  sendChat();
}

function generateReactResponse(input) {
  const lower = input.toLowerCase();
  if (lower.includes('保留') || lower.includes('正确')) {
    return { role:'ai', phase:'reasoning', text:'分析您的标注意图：批量保留根因...\n🔍 检查所有根因的合理性...',
      hookAlert:{ type:'pass', text:'🪝 Hook-质量检查: 所有根因参数完整，风险等级合理' },
      gymResult:{ score:85, items:['✅ 完整度: 优秀','✅ 逻辑性: 优秀','⚠️ 安全性: 1项需确认'] }
    };
  }
  if (lower.includes('删除') || lower.includes('错误')) {
    return { role:'ai', phase:'reasoning', text:'分析删除操作的合理性...\n⚠️ 该根因被2个其他教材引用，删除可能产生关联冲突',
      hookAlert:{ type:'warn', text:'🪝 Hook-一致性检查: "液压主泵故障"被《液压油温过高》教材引用，建议同步修改' },
      mcpCard:{ source:'💡 MCP-CaseDatabase', text:'近3个案例中该根因均被排除，删除建议合理' }
    };
  }
  if (lower.includes('修改') || lower.includes('调整')) {
    return { role:'ai', phase:'acting', text:'执行修改建议生成...\n✏️ 将"液压主泵故障"修改为"液压主泵功率控制阀磨损"\n\n正在提交 AgentGym 仿真测试...',
      gymResult:{ score:88, items:['✅ 完整度: 优秀','✅ 逻辑性: 优秀','✅ 可达性: 优秀','⚠️ 安全性: 需确认'] }
    };
  }
  if (lower.includes('回退')) {
    return { role:'ai', phase:'acting', text:'已回退上一次操作。当前状态恢复到修改前。' };
  }
  // Default response
  return { role:'ai', phase:'reasoning', text:`分析您的输入："${input}"\n\n正在理解您的意图...请确认您希望对哪个部分进行什么操作？` };
}

function scrollChat() {
  setTimeout(() => {
    const el = document.getElementById('chatMessages');
    if (el) el.scrollTop = el.scrollHeight;
  }, 50);
}

function useTool(tool) {
  const msgs = {
    plan: { role:'ai', phase:'acting', text:'📋 Plan 工具已激活\n\n请告诉我您的标注计划，我将帮您分解步骤：\n1. 每步修改什么内容\n2. 修改的优先级\n3. 预期的仿真测试结果\n\n示例："我打算分3步：1.调整步骤2参数；2.增加检测点；3.补充注意事项"' },
    delegation: { role:'ai', phase:'acting', text:'📤 委派工具已激活\n\n您可以委派我完成批量任务：\n- "把所有液压系统教材中步骤1的压力检测统一"\n- "检查所有教材中是否有遗漏的安全警告"\n\n请描述您的委派任务：', mcpCard:{ source:'📚 MCP-KnowledgeBase', text:'找到5份相关教材，可批量处理' } },
    batch: { role:'ai', phase:'acting', text:'📦 批量标注工具已激活\n\n已识别到3个相似故障现象：\n1. 液压系统行走无力\n2. 液压系统动作缓慢\n3. 液压系统压力不足\n\n您可以一次性确认相同的修改：', mcpCard:{ source:'💡 MCP-CaseDatabase', text:'3个故障共涉及15条相似根因' } },
    search: { role:'ai', phase:'acting', text:'🔍 知识检索工具已激活\n\n正在搜索相关知识...', mcpCard:{ source:'📚 MCP-KnowledgeBase', text:'找到3位专家对类似故障的标注记录，是否查看？' } }
  };
  state.chatHistory.push(msgs[tool]);
  render();
  scrollChat();
}

function showAnnotationPanel() {
  // Toggle annotation content in chat
  const tb = state.textbook;
  let html = '<div class="card-title">📝 结构化标注</div>';
  html += '<div class="module-tab">';
  ['rootCauses','pruningRules','repairAdvice'].forEach(m => {
    const labels = {rootCauses:'根因列表',pruningRules:'剪枝规则',repairAdvice:'维修建议'};
    html += `<button class="module-tab-btn ${state.activeModule===m?'active':''}" onclick="switchModule('${m}')">${labels[m]}</button>`;
  });
  html += '</div>';
  if (state.activeModule === 'rootCauses') {
    tb.rootCauses.forEach((rc,i) => {
      html += `<div class="root-cause-item">
        <span class="rc-num">${i+1}</span>
        <span class="rc-text">${rc.text}</span>
        ${rc.status!=='kept'?`<span class="rc-badge ${rc.status}">${{kept:'保留',deleted:'已删',modified:'已改',new:'新增'}[rc.status]}</span>`:''}
        <div class="rc-actions">
          <button class="rc-btn keep ${rc.status==='kept'?'active':''}" onclick="setRcStatus('${rc.id}','kept')">保留</button>
          <button class="rc-btn delete ${rc.status==='deleted'?'active':''}" onclick="setRcStatus('${rc.id}','deleted')">删除</button>
          <button class="rc-btn edit ${rc.status==='modified'?'active':''}" onclick="setRcStatus('${rc.id}','modified')">修改</button>
        </div>
      </div>`;
    });
    html += `<div class="add-rc"><input placeholder="输入新增根因描述..." id="newRcInput" value="${state.newRcText}" oninput="state.newRcText=this.value"><button class="btn btn-primary" style="padding:8px 16px;font-size:13px" onclick="addRootCause()">+ 新增</button></div>`;
  } else {
    const items = tb[state.activeModule];
    items.forEach((item,i) => {
      html += `<div class="segment">
        <div class="segment-text">${i+1}. ${item.text}</div>
        <div class="segment-actions">
          <button class="seg-btn approve ${item.status==='approved'?'active':''}" onclick="setSegStatus('${state.activeModule}','${item.id}','approved')">✅ 通过</button>
          <button class="seg-btn modify ${item.status==='modified'?'active':''}" onclick="setSegStatus('${state.activeModule}','${item.id}','modified')">✏️ 修改</button>
          <button class="seg-btn reject ${item.status==='rejected'?'active':''}" onclick="setSegStatus('${state.activeModule}','${item.id}','rejected')">❌ 驳回</button>
        </div>
        <div class="modify-box ${item.status==='modified'?'show':''}" id="mod-${item.id}">
          <textarea placeholder="输入修改内容...">${item.modifiedText||''}</textarea>
        </div>
      </div>`;
    });
  }
  state.chatHistory.push({ role:'ai', phase:'acting', text: '__ANNOTATION_PANEL__' });
  // Instead, render inline
  const chatMsgs = document.getElementById('chatMessages');
  if (chatMsgs) {
    const div = document.createElement('div');
    div.className = 'chat-msg ai';
    div.innerHTML = `<div class="msg-bubble" style="max-width:100%;width:100%">${html}</div>`;
    chatMsgs.appendChild(div);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
  }
}

function switchModule(m) {
  state.activeModule = m;
  // Remove last annotation panel message and re-show
  state.chatHistory = state.chatHistory.filter(m => m.text !== '__ANNOTATION_PANEL__');
  showAnnotationPanel();
}

function setRcStatus(id, status) {
  const rc = state.textbook.rootCauses.find(r => r.id === id);
  if (rc) rc.status = status;
  // Re-render annotation panel by removing last and re-showing
  state.chatHistory = state.chatHistory.filter(m => m.text !== '__ANNOTATION_PANEL__');
  showAnnotationPanel();
  // Update hook status
  if (status === 'deleted') {
    state.hookResults.consistency = 'warn';
  } else {
    state.hookResults.quality = 'pass';
  }
}

function setSegStatus(module, id, status) {
  const item = state.textbook[module].find(r => r.id === id);
  if (item) item.status = status;
  state.chatHistory = state.chatHistory.filter(m => m.text !== '__ANNOTATION_PANEL__');
  showAnnotationPanel();
}

function addRootCause() {
  if (!state.newRcText.trim()) return;
  state.textbook.rootCauses.push({
    id: 'RC' + (state.textbook.rootCauses.length + 1),
    text: state.newRcText.trim(),
    status: 'new'
  });
  state.newRcText = '';
  state.chatHistory = state.chatHistory.filter(m => m.text !== '__ANNOTATION_PANEL__');
  showAnnotationPanel();
}

function continueNext() {
  state.step = 1;
  state.product = null;
  state.fault = null;
  state.chatHistory = [...CHAT_HISTORY];
  state.gymStatus = 'idle';
  state.gymScore = null;
  state.hookResults = { quality:'idle', consistency:'idle', sync:'idle' };
  state.textbook = JSON.parse(JSON.stringify(TEXTBOOK));
  showToast('✅ 已发布，开始下一个故障', 'success');
  render();
}

// ============ REVISION PANEL ============
function toggleRevisionPanel() {
  const overlay = document.getElementById('revOverlay');
  const panel = document.getElementById('revPanel');
  const show = !panel.classList.contains('show');
  overlay.classList.toggle('show', show);
  panel.classList.toggle('show', show);
  if (show) renderRevisionList();
}

function renderRevisionList() {
  const body = document.getElementById('revBody');
  body.innerHTML = `
    <div style="margin-bottom:12px;font-size:13px;color:var(--gray-500)">共 ${REVISION_TASKS.length} 条待处理修订任务</div>
    ${REVISION_TASKS.map(t => `
      <div class="rev-task ${t.priority}" onclick="openRevisionDialog('${t.id}')">
        <span class="rev-type ${t.type}">${{root_cause:'根因冲突',path:'路径冲突',association:'关联冲突'}[t.type]}</span>
        <div style="font-size:14px;font-weight:600;margin-top:4px">${t.fault}</div>
        <div class="rev-source">来源: ${t.source}</div>
        <div class="rev-suggestion">${t.desc}</div>
        <div style="margin-top:4px;font-size:12px;color:var(--primary)">建议: ${t.suggestion}</div>
      </div>
    `).join('')}
  `;
}

function openRevisionDialog(id) {
  const task = REVISION_TASKS.find(t => t.id === id);
  if (!task) return;
  const body = document.getElementById('revBody');
  body.innerHTML = `
    <div class="rev-dialog show" style="height:100%">
      <div class="rev-dialog-header">
        <button class="rev-back" onclick="renderRevisionList()">←</button>
        <div>
          <div style="font-weight:600">${task.fault}</div>
          <div style="font-size:12px;color:var(--gray-500)">${task.desc}</div>
        </div>
      </div>
      <div class="rev-dialog-body">
        <div class="rev-task-nav">
          ${REVISION_TASKS.map((t,i) => `
            <div class="rev-nav-item ${t.id===id?'active':''} ${t.status!=='pending'?'done':''}">
              <div class="rev-nav-dot" style="background:${{high:'var(--danger)',medium:'var(--warning)',low:'var(--gray-400)'}[t.priority]}"></div>
              ${{root_cause:'根因',path:'路径',association:'关联'}[t.type]} #${i+1}
            </div>
          `).join('')}
        </div>
        <div class="rev-chat-area">
          <div class="rev-chat-messages" style="padding:16px;overflow-y:auto;flex:1">
            <div class="chat-msg ai">
              <div><span class="react-tag reasoning">Reasoning</span></div>
              <div class="msg-bubble">分析修订任务 ${id}...\n\n📋 修订类型：${{root_cause:'根因冲突',path:'路径冲突',association:'关联冲突'}[task.type]}\n📌 优先级：${{high:'高',medium:'中',low:'低'}[task.priority]}\n📎 来源：${task.source}\n\n📝 问题描述：${task.desc}\n💡 建议：${task.suggestion}\n\n您如何看待这个修订建议？</div>
            </div>
          </div>
          <div class="rev-chat-input">
            <input class="chat-input" placeholder="回复修订意见..." style="flex:1">
            <button class="send-btn" style="padding:8px 16px" onclick="sendRevisionChat()">发送</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function sendRevisionChat() {
  showToast('💬 对话式修订功能已触发', 'success');
}

// ============ TOAST ============
function showToast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ============ INIT ============
render();
</script>
</body>
</html>
