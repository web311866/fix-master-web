<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故障教材评测平台 v2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#3B82F6;--primary-light:#DBEAFE;--primary-dark:#1D4ED8;
  --success:#10B981;--success-light:#D1FAE5;
  --warning:#F59E0B;--warning-light:#FEF3C7;
  --danger:#EF4444;--danger-light:#FEE2E2;
  --ai-bg:#EEF2FF;--reason-bg:#FEF3C7;--act-bg:#DBEAFE;
  --hook-bg:#F0FDF4;--gym-bg:#FDF4FF;
  --gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;
  --gray-300:#D1D5DB;--gray-400:#9CA3AF;--gray-500:#6B7280;
  --gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--gray-50);color:var(--gray-800);line-height:1.6}
.app{max-width:1400px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.header{background:#fff;border-bottom:1px solid var(--gray-200);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:16px}
.logo{font-size:18px;font-weight:700;color:var(--primary)}
.nav-tabs{display:flex;gap:4px}
.nav-tab{padding:6px 16px;border-radius:20px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--gray-600);border:1px solid transparent;transition:all .2s}
.nav-tab:hover{background:var(--gray-100)}
.nav-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.header-right{display:flex;align-items:center;gap:12px}
.user-info{font-size:13px;color:var(--gray-500)}

.stepper{background:#fff;padding:16px 24px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;overflow-x:auto}
.step-item{display:flex;align-items:center;gap:8px;white-space:nowrap}
.step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:2px solid var(--gray-300);color:var(--gray-400);transition:all .3s}
.step-item.active .step-num{background:var(--primary);color:#fff;border-color:var(--primary)}
.step-item.done .step-num{background:var(--success);color:#fff;border-color:var(--success)}
.step-label{font-size:13px;color:var(--gray-500)}
.step-item.active .step-label{color:var(--gray-800);font-weight:600}
.step-item.done .step-label{color:var(--success)}
.step-sep{width:32px;height:2px;background:var(--gray-200);margin:0 4px;flex-shrink:0}

.main{flex:1;padding:24px;overflow-y:auto}
.panel{display:none}.panel.active{display:block}
.card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--gray-200);padding:20px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}

.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.product-card{background:#fff;border:2px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px;text-align:center;cursor:pointer;transition:all .2s}
.product-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(59,130,246,.15)}
.product-card.selected{border-color:var(--primary);background:var(--primary-light)}
.product-icon{font-size:32px;margin-bottom:8px}
.product-name{font-size:14px;font-weight:600}

.fault-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fault-tag{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid var(--success);background:var(--success-light);color:#065F46;transition:all .2s;display:flex;align-items:center;gap:6px}
.fault-tag:hover{border-color:var(--primary)}
.fault-tag.selected{background:var(--primary);color:#fff;border-color:var(--primary)}

.mcp-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:12px 16px;margin:12px 0;font-size:13px}
.mcp-card .mcp-source{font-size:11px;color:var(--gray-500);margin-bottom:4px;display:flex;align-items:center;gap:4px}

/* Chat bubbles */
.chat-area{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden}
.chat-header{padding:12px 16px;border-bottom:1px solid var(--gray-200);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.chat-messages{max-height:400px;overflow-y:auto;padding:16px}
.chat-msg{margin-bottom:12px}
.chat-msg.user{margin-right:60px}
.chat-msg.ai{margin-left:60px}
.msg-bubble{display:inline-block;padding:10px 14px;border-radius:var(--radius-lg);font-size:13px;max-width:100%}
.user .msg-bubble{background:var(--primary-light);border:1px solid #93C5FD}
.ai .msg-bubble{background:var(--ai-bg);border:1px solid #C7D2FE}
.msg-meta{font-size:11px;color:var(--gray-400);margin-top:2px}
.report-highlight{border:2px solid #8B5CF6;border-radius:var(--radius);padding:10px;margin:8px 0;background:var(--gym-bg)}

/* Report */
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.report-module{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:16px}
.report-module h4{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.report-content{font-size:13px;color:var(--gray-700);line-height:1.8}
.report-content ul{list-style:disc;padding-left:20px}

/* Root Cause Evaluation */
.rc-eval-item{padding:14px;border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:10px;background:#fff}
.rc-eval-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rc-eval-num{font-size:12px;font-weight:700;color:var(--gray-400)}
.rc-eval-text{font-size:14px;margin-bottom:8px}
.rc-eval-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;font-size:12px}
.rc-compare-col{padding:8px;border-radius:6px;background:var(--gray-50)}
.rc-compare-label{font-size:11px;font-weight:600;color:var(--gray-500);margin-bottom:4px}
.rc-eval-actions{display:flex;gap:6px;flex-wrap:wrap}
.eval-btn{padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--gray-300);background:#fff;font-weight:600;transition:all .2s}
.eval-btn.correct{color:var(--success)}.eval-btn.correct.active{background:var(--success);color:#fff}
.eval-btn.unnecessary{color:var(--warning)}.eval-btn.unnecessary.active{background:var(--warning);color:#fff}
.eval-btn.wrong{color:var(--danger)}.eval-btn.wrong.active{background:var(--danger);color:#fff}
.eval-btn.missing{color:#8B5CF6}.eval-btn.missing.active{background:#8B5CF6;color:#fff}
.eval-suggestion{margin-top:8px;padding:10px;background:var(--gray-50);border-radius:6px;border:1px dashed var(--gray-300)}
.eval-suggestion textarea{width:100%;border:1px solid var(--gray-300);border-radius:4px;padding:6px;font-size:13px;resize:vertical;min-height:40px;outline:none}
.eval-suggestion textarea:focus{border-color:var(--primary)}

/* Path Evaluation */
.path-step{padding:14px;border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:10px;background:#fff}
.path-step-num{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:4px}
.path-step-text{font-size:14px;margin-bottom:8px}
.path-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.path-col{padding:12px;border-radius:var(--radius)}
.path-col.textbook{background:var(--success-light);border:1px solid #86EFAC}
.path-col.ai-path{background:var(--primary-light);border:1px solid #93C5FD}
.path-col-label{font-size:11px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.path-error-types{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.correct-path-input{margin-top:8px;padding:10px;background:var(--gray-50);border-radius:6px;border:1px dashed var(--gray-300)}
.correct-path-input textarea{width:100%;border:1px solid var(--gray-300);border-radius:4px;padding:6px;font-size:13px;resize:vertical;min-height:40px;outline:none}

/* React tags */
.react-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-bottom:6px}
.react-tag.reasoning{background:var(--reason-bg);color:#92400E}
.react-tag.acting{background:var(--act-bg);color:#1E40AF}
.react-tag.gym{background:var(--gym-bg);color:#6B21A8}

/* Stats */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat-box{padding:10px;border-radius:var(--radius);text-align:center;font-size:12px}
.stat-box .num{font-size:20px;font-weight:700;display:block}
.stat-box.green{background:var(--success-light);color:#065F46}
.stat-box.amber{background:var(--warning-light);color:#92400E}
.stat-box.red{background:var(--danger-light);color:#991B1B}
.stat-box.purple{background:#F3E8FF;color:#6B21A8}

/* Score Dimensions */
.dim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.dim-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:16px;text-align:center}
.dim-card .dim-icon{font-size:24px;margin-bottom:4px}
.dim-card .dim-name{font-size:12px;font-weight:600;color:var(--gray-500)}
.dim-card .dim-score{font-size:28px;font-weight:700;margin:4px 0}
.dim-card .dim-grade{font-size:12px;padding:2px 10px;border-radius:10px;font-weight:600}

/* Revision Task Cards */
.rev-task-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rev-task-card{padding:14px;border-radius:var(--radius);border:1px solid var(--gray-200)}
.rev-task-card.root{border-left:3px solid var(--danger);background:#FEF2F2}
.rev-task-card.path{border-left:3px solid var(--primary);background:var(--primary-light)}
.rev-task-type{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:4px}
.rev-task-card.root .rev-task-type{background:var(--danger-light);color:#991B1B}
.rev-task-card.path .rev-task-type{background:var(--primary-light);color:#1E40AF}
.rev-task-desc{font-size:13px;color:var(--gray-700);margin:4px 0}
.rev-task-action{font-size:12px;color:var(--primary);font-weight:600}

/* AgentGym Compare */
.gym-compare{margin-top:16px}
.gym-compare-table{width:100%;border-collapse:collapse;font-size:13px}
.gym-compare-table th{text-align:left;padding:8px 12px;background:var(--gray-100);border-bottom:2px solid var(--gray-200);font-weight:600}
.gym-compare-table td{padding:8px 12px;border-bottom:1px solid var(--gray-100)}
.improvement{color:var(--success);font-weight:600}
.degradation{color:var(--danger);font-weight:600}

.btn{padding:10px 24px;border-radius:var(--radius);font-size:14px;cursor:pointer;border:1px solid var(--gray-300);background:#fff;font-weight:600;transition:all .2s}
.btn:hover{background:var(--gray-50)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-warning{background:var(--warning);color:#fff;border-color:var(--warning)}
.btn-group{display:flex;gap:12px;margin-top:16px}

.toast{position:fixed;top:80px;right:24px;padding:12px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;z-index:300;transform:translateX(120%);transition:transform .3s;display:flex;align-items:center;gap:8px}
.toast.show{transform:translateX(0)}
.toast.success{background:var(--success);color:#fff}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-left">
      <div class="logo">🔬 故障教材评测平台 v2.0</div>
      <nav class="nav-tabs">
        <a href="index.html" class="nav-tab">教材标注</a>
        <a href="evaluate.html" class="nav-tab active">教材评测</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="user-info">👤 张工 6001</div>
    </div>
  </header>
  <div class="stepper" id="stepper"></div>
  <div class="main" id="mainContent"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const PRODUCTS = [
  {id:'excavator',name:'挖掘机',icon:'🚜',faults:5},
  {id:'pump',name:'泵车',icon:'🏗️',faults:2},
  {id:'crane',name:'起重机',icon:'🏗️',faults:3}
];

const FAULTS = {
  excavator: [
    {id:'F001',name:'液压系统行走无力',ver:'v2.0',evalCount:3,avgScore:82},
    {id:'F002',name:'发动机启动困难',ver:'v1.3',evalCount:1,avgScore:78},
    {id:'F003',name:'回转系统异响',ver:'v1.1',evalCount:0,avgScore:null},
    {id:'F005',name:'液压油温过高',ver:'v1.5',evalCount:2,avgScore:85}
  ],
  pump: [
    {id:'F101',name:'泵送压力不足',ver:'v1.2',evalCount:1,avgScore:80}
  ]
};

const SESSIONS = [
  {id:'S001',time:'2026-05-02 14:30',result:'success',feedback:'已解决'},
  {id:'S002',time:'2026-05-01 09:15',result:'fail',feedback:'根因判断错误'},
  {id:'S003',time:'2026-04-30 16:45',result:'success',feedback:'步骤准确'}
];

const CHAT_SESSION = [
  {role:'user',text:'挖掘机行走无力，左侧更明显'},
  {role:'ai',text:'根据故障现象，可能涉及液压系统行走部分。让我逐步排查...\n\n首先检查行走先导压力是否正常。'},
  {role:'user',text:'先导压力3.2MPa'},
  {role:'ai',text:'先导压力正常（标准值2.5-4.0MPa）。继续检查主泵压力。'},
  {role:'user',text:'主泵压力18MPa，偏低'},
  {role:'ai',text:'主泵压力偏低（标准值25-35MPa），可能原因：\n1. 主溢流阀设定压力偏低\n2. 主泵内部磨损\n3. 液压油流量调节阀卡滞',isReport:true},
  {role:'ai',text:'---\n📋 故障规划报告\n\n**故障现象标题：** 液压系统行走无力\n\n**故障现象描述：** 挖掘机行走速度明显减慢，左侧行走更加无力，先导压力正常但主泵压力偏低\n\n**故障可能根因：**\n1. 主溢流阀设定压力偏低\n2. 主泵内部磨损\n3. 液压油流量调节阀卡滞\n4. 行走马达溢流阀故障\n5. 液压油污染或变质\n\n**故障排查步骤：**\n步骤1: 检查主泵压力 → 18MPa（偏低）\n步骤2: 检查主溢流阀设定 → 确认偏低\n步骤3: 检查液压油品质 → 正常\n步骤4: 调整主溢流阀压力至标准值 → 故障排除',isReport:true}
];

const AI_ROOT_CAUSES = [
  {id:'ARC1',text:'主溢流阀设定压力偏低',textbookMatch:true,textbookText:'主溢流阀设定压力偏低或故障'},
  {id:'ARC2',text:'主泵内部磨损',textbookMatch:true,textbookText:'行走马达内部故障（排量调节机构卡滞、柱塞磨损）'},
  {id:'ARC3',text:'液压油流量调节阀卡滞',textbookMatch:true,textbookText:'液压油流量调节阀卡滞或损坏'},
  {id:'ARC4',text:'行走马达溢流阀故障',textbookMatch:true,textbookText:'行走马达溢流阀故障'},
  {id:'ARC5',text:'液压油污染或变质',textbookMatch:true,textbookText:'液压油污染或变质'},
  {id:'ARC6',text:'先导压力不足',textbookMatch:false,textbookText:'行走先导压力不足（教材中存在但未在AI报告中体现）'}
];

const AI_PATH_STEPS = [
  {id:'PS1',num:1,aiText:'检查主泵压力',tbText:'检查行走先导压力',errorType:null},
  {id:'PS2',num:2,aiText:'检查主溢流阀设定',tbText:'若先导正常→检查主泵压力',errorType:null},
  {id:'PS3',num:3,aiText:'检查液压油品质',tbText:'若先导不足→排查先导油路',errorType:null},
  {id:'PS4',num:4,aiText:'调整主溢流阀压力',tbText:'检查主溢流阀设定压力',errorType:null}
];

let state = {
  step:1, product:null, fault:null, session:null,
  rcEvals:{}, pathEvals:{},
  newMissingRc:'', correctPaths:{},
  dimensions:{quality:82,efficiency:78,value:71,performance:92}
};

const STEPS = ['选择产品','选择故障','加载会话','提取报告','根因评测','路径评测','生成修订'];

function render() {
  renderStepper();
  renderMain();
}

function renderStepper() {
  document.getElementById('stepper').innerHTML = STEPS.map((s,i) => {
    const cls = i+1 < state.step ? 'done' : i+1 === state.step ? 'active' : '';
    const sep = i < STEPS.length-1 ? '<div class="step-sep"></div>' : '';
    return `<div class="step-item ${cls}"><div class="step-num">${i+1 < state.step ? '✓' : i+1}</div><div class="step-label">${s}</div></div>${sep}`;
  }).join('');
}

function renderMain() {
  const el = document.getElementById('mainContent');
  switch(state.step) {
    case 1: el.innerHTML = renderS1(); break;
    case 2: el.innerHTML = renderS2(); break;
    case 3: el.innerHTML = renderS3(); break;
    case 4: el.innerHTML = renderS4(); break;
    case 5: el.innerHTML = renderS5(); break;
    case 6: el.innerHTML = renderS6(); break;
    case 7: el.innerHTML = renderS7(); break;
  }
}

function renderS1() {
  return `<div class="card"><div class="card-title">📦 选择产品大类</div>
    <div class="product-grid">
      ${PRODUCTS.map(p => `<div class="product-card ${state.product===p.id?'selected':''}" onclick="selectProduct('${p.id}')">
        <div class="product-icon">${p.icon}</div><div class="product-name">${p.name}</div>
      </div>`).join('')}
    </div>
    ${state.product?`<div style="margin-top:16px;text-align:right"><button class="btn btn-primary" onclick="goStep(2)">下一步 →</button></div>`:''}
  </div>`;
}

function renderS2() {
  const faults = FAULTS[state.product]||[];
  return `<div class="card"><div class="card-title">🔍 选择故障现象（仅已有教材可评测）</div>
    <div class="fault-tags">
      ${faults.map(f => `<div class="fault-tag ${state.fault===f.id?'selected':''}" onclick="selectFault('${f.id}')">
        ${f.name} <span style="font-size:11px;opacity:.7">${f.ver} | 评测${f.evalCount}次</span>
      </div>`).join('')}
    </div>
    ${state.fault?`<div class="mcp-card"><div class="mcp-source">👤 MCP-ExpertDatabase</div><div class="mcp-content">推荐 3 位擅长该领域的评测专家</div></div>
    <div style="margin-top:16px;text-align:right"><button class="btn btn-primary" onclick="goStep(3)">下一步 →</button></div>`:''}
  </div>`;
}

function renderS3() {
  return `<div class="card"><div class="card-title">💬 诊断会话记录</div>
    <div style="margin-bottom:12px;font-size:13px;color:var(--gray-500)">选择一条会话记录进行评测</div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      ${SESSIONS.map(s => `<div style="padding:8px 14px;border-radius:8px;border:1px solid ${state.session===s.id?'var(--primary)':'var(--gray-200)'};cursor:pointer;font-size:13px;background:${state.session===s.id?'var(--primary-light)':'#fff'}" onclick="selectSession('${s.id}')">
        ${s.time} | <span style="color:${s.result==='success'?'var(--success)':'var(--danger)'}">${{success:'✅成功',fail:'❌失败'}[s.result]}</span> | ${s.feedback}
      </div>`).join('')}
    </div>
    ${state.session?`<div class="chat-area">
      <div class="chat-header">💬 会话 ${state.session}</div>
      <div class="chat-messages">
        ${CHAT_SESSION.map(m => `<div class="chat-msg ${m.role==='user'?'user':'ai'}">
          <div class="msg-bubble ${m.isReport?'report-highlight':''}">${m.text.replace(/\n/g,'<br>')}</div>
          <div class="msg-meta">${m.role==='user'?'👤 用户':'🤖 AI'}${m.isReport?' 📋 故障报告':''}</div>
        </div>`).join('')}
      </div>
    </div>
    <div style="margin-top:16px;text-align:right"><button class="btn btn-primary" onclick="goStep(4)">提取报告 →</button></div>`:''}
  </div>`;
}

function renderS4() {
  return `<div class="card"><div class="card-title">📋 故障规划报告（已提取）</div>
    <div class="report-grid">
      <div class="report-module"><h4>📌 故障现象标题</h4><div class="report-content">液压系统行走无力</div></div>
      <div class="report-module"><h4>📝 故障现象描述</h4><div class="report-content">挖掘机行走速度明显减慢，左侧行走更加无力，先导压力正常但主泵压力偏低</div></div>
      <div class="report-module"><h4>🔍 故障可能根因</h4><div class="report-content"><ul>${AI_ROOT_CAUSES.map(r => `<li>${r.text}${!r.textbookMatch?' <span style="color:var(--danger);font-weight:600">⚠️教材中未列出</span>':''}</li>`).join('')}</ul></div></div>
      <div class="report-module"><h4>🔧 故障排查步骤</h4><div class="report-content"><ol>${AI_PATH_STEPS.map(s => `<li>${s.aiText}</li>`).join('')}</ol></div></div>
    </div>
    <div style="margin-top:16px;text-align:right"><button class="btn btn-primary" onclick="goStep(5)">开始根因评测 →</button></div>
  </div>`;
}

function renderS5() {
  const stats = {correct:0,unnecessary:0,wrong:0,missing:0};
  Object.values(state.rcEvals).forEach(v => { if(stats[v]!==undefined) stats[v]++; });

  return `<div class="card"><div class="card-title">🔎 阶段一：根因评测</div>
    <div style="font-size:13px;color:var(--gray-500);margin-bottom:12px">对AI生成的每个根因进行标注：正确/非必要/错误/遗漏</div>
    ${AI_ROOT_CAUSES.map((rc,i) => {
      const eval_ = state.rcEvals[rc.id] || null;
      return `<div class="rc-eval-item">
        <div class="rc-eval-header"><span class="rc-eval-num">#${i+1}</span></div>
        <div class="rc-eval-text"><strong>AI报告：</strong>${rc.text}</div>
        <div class="rc-eval-compare">
          <div class="rc-compare-col"><div class="rc-compare-label">🤖 AI生成</div>${rc.text}</div>
          <div class="rc-compare-col"><div class="rc-compare-label">📘 教材原文</div>${rc.textbookMatch?rc.textbookText:'<span style="color:var(--danger)">未列出</span>'}</div>
        </div>
        <div class="rc-eval-actions">
          <button class="eval-btn correct ${eval_==='correct'?'active':''}" onclick="evalRc('${rc.id}','correct')">✅ 正确</button>
          <button class="eval-btn unnecessary ${eval_==='unnecessary'?'active':''}" onclick="evalRc('${rc.id}','unnecessary')">⚠️ 非必要</button>
          <button class="eval-btn wrong ${eval_==='wrong'?'active':''}" onclick="evalRc('${rc.id}','wrong')">❌ 错误</button>
          <button class="eval-btn missing ${eval_==='missing'?'active':''}" onclick="evalRc('${rc.id}','missing')">➕ 遗漏</button>
        </div>
        ${eval_&&eval_!=='correct'?`<div class="eval-suggestion"><textarea placeholder="修订说明（如需）...">${state.rcEvals[rc.id+'_note']||''}</textarea></div>`:''}
        ${eval_?`<div style="margin-top:8px"><span class="react-tag ${eval_==='wrong'?'reasoning':'acting'}">${{correct:'Acting: 无需修订',unnecessary:'Reasoning: 建议降级',wrong:'Reasoning: 需删除/修改',missing:'Acting: 需补充教材'}[eval_]}</span></div>`:''}
      </div>`;
    }).join('')}

    <div style="margin-top:16px;padding:12px;background:var(--gray-50);border-radius:var(--radius);border:1px dashed var(--gray-300)">
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">➕ 添加遗漏根因（教材中有但AI未列出的）</div>
      <div style="display:flex;gap:8px"><input style="flex:1;padding:8px;border:1px solid var(--gray-300);border-radius:6px;font-size:13px;outline:none" placeholder="输入遗漏的根因..." id="missingRcInput"><button class="btn btn-primary" style="padding:8px 14px;font-size:13px" onclick="addMissingRc()">添加</button></div>
    </div>

    <div class="stats-bar">
      <div class="stat-box green"><span class="num">${stats.correct}</span>正确</div>
      <div class="stat-box amber"><span class="num">${stats.unnecessary}</span>非必要</div>
      <div class="stat-box red"><span class="num">${stats.wrong}</span>错误</div>
      <div class="stat-box purple"><span class="num">${stats.missing}</span>遗漏</div>
    </div>

    <div class="btn-group" style="justify-content:flex-end">
      <button class="btn" onclick="goStep(4)">← 返回</button>
      <button class="btn btn-primary" onclick="goStep(6)">路径评测 →</button>
    </div>
  </div>`;
}

function renderS6() {
  const stats = {correct:0,order:0,condition:0,missing:0,redundant:0,conclusion:0};
  Object.values(state.pathEvals).forEach(v => { if(stats[v]!==undefined) stats[v]++; });

  return `<div class="card"><div class="card-title">🔧 阶段二：路径评测</div>
    <div style="font-size:13px;color:var(--gray-500);margin-bottom:12px">对AI给出的排查步骤逐步标注，指出错误路径并标注正确路径</div>
    ${AI_PATH_STEPS.map(ps => {
      const eval_ = state.pathEvals[ps.id] || null;
      return `<div class="path-step">
        <div class="path-step-num">步骤 ${ps.num}</div>
        <div class="path-compare">
          <div class="path-col textbook"><div class="path-col-label">📘 教材原路径</div>${ps.tbText}</div>
          <div class="path-col ai-path"><div class="path-col-label">🤖 AI生成路径</div>${ps.aiText}</div>
        </div>
        <div style="font-size:13px;font-weight:600;margin-bottom:6px">您的判定：</div>
        <div class="path-error-types">
          <button class="eval-btn correct ${eval_==='correct'?'active':''}" onclick="evalPath('${ps.id}','correct')">✅ 正确</button>
          <button class="eval-btn wrong ${eval_==='order'?'active':''}" onclick="evalPath('${ps.id}','order')">🔄 顺序错误</button>
          <button class="eval-btn unnecessary ${eval_==='condition'?'active':''}" onclick="evalPath('${ps.id}','condition')">❓ 条件错误</button>
          <button class="eval-btn missing ${eval_==='missing'?'active':''}" onclick="evalPath('${ps.id}','missing')">➖ 遗漏步骤</button>
          <button class="eval-btn unnecessary ${eval_==='redundant'?'active':''}" onclick="evalPath('${ps.id}','redundant')">➕ 冗余步骤</button>
          <button class="eval-btn wrong ${eval_==='conclusion'?'active':''}" onclick="evalPath('${ps.id}','conclusion')">❌ 结论错误</button>
        </div>
        ${eval_&&eval_!=='correct'?`<div class="correct-path-input"><div style="font-size:12px;font-weight:600;margin-bottom:4px">正确路径：</div><textarea placeholder="请描述正确的排查路径..." oninput="state.correctPaths['${ps.id}']=this.value">${state.correctPaths[ps.id]||''}</textarea></div>
        <div style="margin-top:6px"><span class="react-tag reasoning">Reasoning: 错误分析 - ${{order:'步骤执行顺序不当',condition:'判断条件/阈值有误',missing:'缺少必要检测步骤',redundant:'存在不必要的步骤',conclusion:'推导结论错误'}[eval_]}</span></div>`:''}
      </div>`;
    }).join('')}

    <div class="stats-bar">
      <div class="stat-box green"><span class="num">${stats.correct}</span>正确</div>
      <div class="stat-box amber"><span class="num">${stats.order}</span>顺序错</div>
      <div class="stat-box red"><span class="num">${stats.condition}</span>条件错</div>
      <div class="stat-box purple"><span class="num">${stats.missing}</span>遗漏</div>
    </div>

    <div class="btn-group" style="justify-content:flex-end">
      <button class="btn" onclick="goStep(5)">← 根因评测</button>
      <button class="btn btn-primary" onclick="goStep(7)">生成修订任务 →</button>
    </div>
  </div>`;
}

function renderS7() {
  const q=82,e=78,v=71,p=92;
  const total = Math.round(q*0.4+e*0.2+v*0.25+p*0.15);
  const grade = total>=90?'A':total>=75?'B':total>=60?'C':'D';
  const gradeColor = total>=90?'var(--success)':total>=75?'var(--primary)':total>=60?'var(--warning)':'var(--danger)';

  return `<div class="card"><div class="card-title">📊 评测报告 & 修订任务</div>
    <div style="text-align:center;margin:20px 0">
      <div style="font-size:48px;font-weight:800;color:${gradeColor}">${total}</div>
      <div style="font-size:16px;font-weight:600">${grade}级</div>
    </div>
    <div class="dim-grid">
      <div class="dim-card"><div class="dim-icon">📌</div><div class="dim-name">标注质量</div><div class="dim-score" style="color:var(--success)">${q}</div><div class="dim-grade" style="background:var(--success-light);color:#065F46">优秀</div></div>
      <div class="dim-card"><div class="dim-icon">⚡</div><div class="dim-name">标注效率</div><div class="dim-score" style="color:var(--primary)">${e}</div><div class="dim-grade" style="background:var(--primary-light);color:#1E40AF">良好</div></div>
      <div class="dim-card"><div class="dim-icon">💎</div><div class="dim-name">知识价值</div><div class="dim-score" style="color:var(--warning)">${v}</div><div class="dim-grade" style="background:var(--warning-light);color:#92400E">待提升</div></div>
      <div class="dim-card"><div class="dim-icon">🔧</div><div class="dim-name">系统性能</div><div class="dim-score" style="color:var(--success)">${p}</div><div class="dim-grade" style="background:var(--success-light);color:#065F46">优秀</div></div>
    </div>

    <div class="card"><div class="card-title">📋 自动生成的修订任务</div>
      <div class="rev-task-grid">
        ${generateRevisionTasks().map(t => `<div class="rev-task-card ${t.cardType}">
          <span class="rev-task-type">${t.typeLabel}</span>
          <div class="rev-task-desc">${t.desc}</div>
          <div class="rev-task-action">→ ${t.action}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="card"><div class="card-title">🧪 AgentGym 修订前后对比</div>
      <div class="gym-compare">
        <table class="gym-compare-table">
          <tr><th>指标</th><th>修订前</th><th>修订后（预估）</th></tr>
          <tr><td>诊断成功率</td><td>76%</td><td class="improvement">84% ↑8%</td></tr>
          <tr><td>平均步骤数</td><td>8步</td><td class="improvement">6步 ↓2步</td></tr>
          <tr><td>诊断耗时</td><td>12min</td><td class="improvement">9min ↓3min</td></tr>
          <tr><td>安全风险</td><td>1处</td><td class="improvement">0处 ✅</td></tr>
        </table>
      </div>
      <div style="margin-top:12px;padding:10px;background:var(--success-light);border-radius:var(--radius);font-size:13px;display:flex;align-items:center;gap:8px">
        ✅ 建议：发布修订版本
      </div>
    </div>

    <div class="card"><div class="card-title">🔄 选择修订模式</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div style="padding:20px;border:2px solid var(--gray-200);border-radius:var(--radius-lg);text-align:center;cursor:pointer;transition:all .2s" onclick="selectRevMode('quick')" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--gray-200)'">
          <div style="font-size:32px;margin-bottom:8px">📋</div>
          <div style="font-weight:600;margin-bottom:4px">快速审核</div>
          <div style="font-size:12px;color:var(--gray-500)">逐条勾选接受/拒绝</div>
        </div>
        <div style="padding:20px;border:2px solid var(--gray-200);border-radius:var(--radius-lg);text-align:center;cursor:pointer;transition:all .2s" onclick="selectRevMode('dialog')" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--gray-200)'">
          <div style="font-size:32px;margin-bottom:8px">💬</div>
          <div style="font-weight:600;margin-bottom:4px">对话式修订</div>
          <div style="font-size:12px;color:var(--gray-500)">AI引导ReAct循环，逐步确认</div>
        </div>
      </div>
    </div>

    <div class="btn-group" style="justify-content:center">
      <button class="btn" onclick="goStep(1)">🏠 返回首页</button>
      <button class="btn btn-warning" onclick="generateRevision()">📝 生成修订任务</button>
      <button class="btn btn-primary" onclick="goToAnnotation()">🔧 前往标注平台修订</button>
    </div>
  </div>`;
}

function generateRevisionTasks() {
  const tasks = [];
  Object.entries(state.rcEvals).forEach(([id,eval_]) => {
    if (!eval_ || eval_==='correct') return;
    const rc = AI_ROOT_CAUSES.find(r=>r.id===id);
    if (!rc) return;
    const typeMap = {wrong:{type:'root',label:'根因修订-删除/修改',desc:`根因"${rc.text}"被标记为错误`,action:'删除或修改该根因'},
      unnecessary:{type:'root',label:'根因修订-降级',desc:`根因"${rc.text}"被标记为非必要`,action:'降低优先级或移至补充列表'},
      missing:{type:'root',label:'根因修订-新增',desc:`遗漏根因"${rc.text}"`,action:'补充到教材根因列表'}};
    const t = typeMap[eval_];
    if (t) tasks.push({cardType:t.type,...t});
  });
  Object.entries(state.pathEvals).forEach(([id,eval_]) => {
    if (!eval_ || eval_==='correct') return;
    const ps = AI_PATH_STEPS.find(p=>p.id===id);
    if (!ps) return;
    const typeMap = {order:{type:'path',label:'路径修订-顺序',desc:`步骤${ps.num}顺序错误`,action:'调整步骤执行顺序'},
      condition:{type:'path',label:'路径修订-参数',desc:`步骤${ps.num}判断条件错误`,action:'修正参数标准值'},
      missing:{type:'path',label:'路径修订-补充',desc:`步骤${ps.num}遗漏必要检测`,action:'补充检测步骤'},
      redundant:{type:'path',label:'路径修订-精简',desc:`步骤${ps.num}为冗余步骤`,action:'移除不必要步骤'},
      conclusion:{type:'path',label:'路径修订-逻辑',desc:`步骤${ps.num}结论错误`,action:'修正逻辑判断'}};
    const t = typeMap[eval_];
    if (t) tasks.push({cardType:t.type,...t});
  });
  return tasks;
}

// ============ ACTIONS ============
function selectProduct(id) { state.product=id; state.fault=null; render(); }
function selectFault(id) { state.fault=id; render(); }
function selectSession(id) { state.session=id; render(); }
function goStep(n) { state.step=n; render(); }

function evalRc(id, eval_) {
  state.rcEvals[id] = eval_;
  render();
}

function evalPath(id, eval_) {
  state.pathEvals[id] = eval_;
  render();
}

function addMissingRc() {
  const input = document.getElementById('missingRcInput');
  if (!input || !input.value.trim()) return;
  const newId = 'ARC' + (AI_ROOT_CAUSES.length + 1);
  AI_ROOT_CAUSES.push({id:newId,text:input.value.trim(),textbookMatch:false,textbookText:'未列出'});
  state.rcEvals[newId] = 'missing';
  input.value = '';
  render();
  showToast('✅ 已添加遗漏根因','success');
}

function selectRevMode(mode) {
  state.revisionMode = mode;
  showToast(`已选择${mode==='quick'?'快速审核':'对话式修订'}模式`,'success');
}

function generateRevision() {
  const tasks = generateRevisionTasks();
  showToast(`✅ 已生成 ${tasks.length} 条修订任务`,'success');
}

function goToAnnotation() {
  window.location.href = 'index.html';
}

function showToast(msg,type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}

render();
</script>
</body>
</html>
